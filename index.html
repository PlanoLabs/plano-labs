<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0D10" />

    <!-- Título y descripción que muestra Google -->
    <title>PLANO LABS · Páginas web para emprendimientos</title>
    <meta
      name="description"
      content="Creamos la página web de tu emprendimiento: profesional, con dominio propio y un panel para que la edites vos mismo, sin saber programar. Asesoría gratis."
    />

    <!--
      Vista previa al compartir el link (WhatsApp, Instagram, Fiverr, LinkedIn).
      Si más adelante se conecta un dominio propio, hay que cambiar
      las direcciones de og:url y og:image por las del dominio nuevo.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PLANO LABS" />
    <meta property="og:locale" content="es_AR" />
    <meta
      property="og:title"
      content="PLANO LABS · Donde las ideas toman forma"
    />
    <meta
      property="og:description"
      content="Páginas web para emprendimientos: profesionales, con dominio propio y un panel para que las edites vos mismo. Asesoría gratis."
    />
    <meta property="og:url" content="https://plano-labs.vercel.app/" />
    <meta
      property="og:image"
      content="https://plano-labs.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="PLANO LABS: Donde las ideas toman forma."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="PLANO LABS · Donde las ideas toman forma"
    />
    <meta
      name="twitter:description"
      content="Páginas web para emprendimientos: profesionales, con dominio propio y un panel para que las edites vos mismo."
    />
    <meta
      name="twitter:image"
      content="https://plano-labs.vercel.app/og-image.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
